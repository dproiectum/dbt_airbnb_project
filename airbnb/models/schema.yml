#--- dim_hosts_cleansed final : data contract + generic tests ---
  - name: dim_hosts_cleansed     
  #v47-ex5-v48 : need the data contract to be enforced to activate the generic tests !
    config:
      contract :
        enforced: true
    
    constraints:
      - type: primary_key
        columns: [host_id]

    columns:                        
      - name: host_id  
        data_types: integer     
        constraints:
         - type : not_null
         - type : unique      
        data_tests: 
         - not_null
         - unique

      - name: host_name   
        data_types: string  
        constraints:
         - type : not_null    
        data_tests: 
         - not_null

      - name: is_superhost      
        data_types: string        
        data_tests:
         - accepted_values:         
              arguments:
                values: ['t','f']