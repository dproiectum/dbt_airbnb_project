#description: This is the test to check the data quality of the dim_listings_cleansed model. 
#It includes tests for 
# unique and not null constraints on listing_id and host_id, 
# as well as a test for accepted values in the room_type column

models:
  - name: dim_listings_cleansed     #the name of the model/table/view
    data_tests:                      #test for the whole model
      - minimum_row_count_test:               #test name to call
          arguments:
            min_row_count_params: 1000         #condition or argument sent to the test parameter 
          severity: error                        #severity level of the test, if the test fails, it will raise an error and stop the dbt run.
    
    columns:                        # test column
     - name: listing_id             
       data_tests:
         - unique
         - not_null

     - name: host_id                
       data_tests:
         - not_null
         - relationships:           #check relationship 
             arguments:
               to: ref('dim_hosts_cleansed')
               field: host_id

     - name: room_type              
       data_tests:
         - accepted_values:         #check if the values in the room_type column are among the accepted values  
             arguments:
               values: ['Entire home/apt',
                        'Private room',
                        'Shared room',
                        'Hotel room']

     - name : minimum_nights
       data_tests :
          - positive_values_test          
          #check if the values in the minimum_nights column are positive
          # when we launch the dbt test, it will run the SQL code in the positive_values.sql file located in the tests/generic directory.




